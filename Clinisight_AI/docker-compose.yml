x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: clinisight-ai:latest
  env_file:
    - .env
  restart: unless-stopped

services:
  api:
    <<: *app
    container_name: clinisight-api
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8084", "--workers", "2"]
    ports:
      - "8081:8081"
    volumes:
      - clinisight_cache:/app/.cache/clinisight
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    <<: *app
    container_name: clinisight-ui
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      CLINISIGHT_API_BASE: http://api:8081
    depends_on:
      api:
        condition: service_healthy

  # Optional: the stdio MCP server. Not a long-running HTTP service, so it's
  # gated behind a profile and needs an attached stdin to be useful:
  #   docker compose --profile mcp run --rm mcp
  mcp:
    <<: *app
    container_name: clinisight-mcp
    command: ["python", "mcp_tool.py"]
    volumes:
      - clinisight_cache:/app/.cache/clinisight
    stdin_open: true
    tty: true
    profiles:
      - mcp

volumes:
  clinisight_cache:
